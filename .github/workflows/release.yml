name: Instaladores Medza

# Este workflow compila e ASSINA (updater do Tauri) os artefatos por plataforma e deixa um rascunho de
# release neste repositório privado. Ele NÃO publica a atualização: o GITHUB_TOKEN só escreve neste
# repo, e o updater baixa do repositório público `repositorioDeReleases` (identidade.json). Para
# publicar, na máquina de quem lança a versão (com o `gh` logado):
#   node scripts/publicar-atualizacao.mjs --de-ci <run-id>             (confere o que subiria)
#   node scripts/publicar-atualizacao.mjs --de-ci <run-id> --publicar
# Detalhes em docs/fork/atualizacao-automatica.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de desktop e voz (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libasound2-dev cmake
      - run: npm ci
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION | tr -d '[:space:]')" = "${GITHUB_REF_NAME}"
      - run: npm run version:check
      # `app` no macOS: é dele que sai o .app.tar.gz (+ .sig) que o updater consome.
      - name: Compilar e assinar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: Medza-Agents-${{ matrix.target }}
          path: installers/*
          if-no-files-found: error

  rascunho:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Preparar release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Medza Agents $GITHUB_REF_NAME" --notes "Instaladores com Whisper local integrado. Cada pessoa conecta suas próprias contas. Consulte o README para instalação e primeiro uso." installers/*
