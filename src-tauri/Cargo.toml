[package]
name = "omni-agents"
version = "0.8.6"
description = "Medza Agents desktop workspace"
authors = []
edition = "2021"

[lib]
name = "omni_agents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Fork: `unstable` = webview filho (aba Navegador, `src/navegador.rs`).
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Já vem na árvore via tauri; declarado aqui só para gerar o --session-id do Claude.
uuid = { version = "1", features = ["v4"] }
# Já vem na árvore via tauri; lê o `config.toml` do Codex na aba Extensões.
toml = "0.9"
tokio = { version = "1", features = ["full"] }
omni-protocol = { path = "../crates/omni-protocol" }
omni-core = { path = "../crates/omni-core" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Fork: voz no chat. Microfone (cpal) e transcrição local com whisper.cpp; Metal no Mac.
cpal = "0.18"
whisper-rs = "0.16"


[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# Fork: tela cheia com o conteúdo descendo junto da barra do macOS (src/tela_cheia.rs).
# Já vêm na árvore via tao/wry; só ligamos os módulos usados.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSGeometry", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSViewController", "NSTitlebarAccessoryViewController", "NSWindow", "NSLayoutConstraint"] }
