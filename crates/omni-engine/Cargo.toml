[package]
name = "omni-engine"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", features = ["clock"] } # Fork: fuso local e DST.
omni-protocol = { path = "../omni-protocol" }
portable-pty = "0.9"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
totp-rs = { version = "5", default-features = false, features = ["otpauth", "gen_secret"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
omni-core = { path = "../omni-core" }
axum = "0.8"
# `oneshot`: o desktop chama as rotas da API por dentro do protocolo do engine (`mobile::local`).
tower = { version = "0.5", features = ["util"] }
vt100 = "0.16"
# Fork: handshake WebSocket do socket Unix (já presentes no lockfile pela casca).
base64 = "0.22"
sha1 = "0.10"
include_dir = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
