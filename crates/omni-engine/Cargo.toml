[package]
name = "omni-engine"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", features = ["clock"] } # Fuso local e DST.
omni-protocol = { path = "../omni-protocol" }
portable-pty = "0.9"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
totp-rs = { version = "5", default-features = false, features = ["otpauth", "gen_secret"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
omni-core = { path = "../omni-core" }
axum = "0.8"
# `oneshot`: o desktop chama as rotas da API por dentro do protocolo do engine (`mobile::local`).
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] } # Vídeo da conversa em pedaços (já vinha pelo hyper).
vt100 = "0.16"
# Handshake WebSocket do socket Unix (já presentes no lockfile pela casca).
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10" # Fork (Google Agenda): PKCE do login (já no lockfile pela casca).
include_dir = "0.7"
# Bot API oficial; erros de transporte nunca saem com a URL (ela contém o token).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
