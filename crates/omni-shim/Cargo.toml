[package]
name = "omni-shim"
version.workspace = true
edition.workspace = true

[[bin]]
name = "omni-shim"
path = "src/main.rs"

[dependencies]
omni-core = { path = "../omni-core" }
omni-protocol = { path = "../omni-protocol" }
# Já no workspace: a linha própria da statusline lê o JSON que o Claude Code manda.
serde_json.workspace = true

[dev-dependencies]
# Fork (harness, A2): pasta temporária nos testes do modo notify (já no Cargo.lock).
tempfile = "3"
